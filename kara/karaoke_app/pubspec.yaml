name: karaoke_app
description: Кроссплатформенный караоке-плеер (ПК + Android TV)
publish_to: 'none'
version: 0.3.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  file_picker: ^8.0.0
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - sample/
