# Автоматическая сборка Windows-приложения (.exe) в облаке GitHub.
# Срабатывает при каждой загрузке кода. Готовый архив с .exe появится
# во вкладке Actions -> последний запуск -> Artifacts -> karaoke-windows.
name: Собрать Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # можно запускать вручную кнопкой

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
        working-directory: karaoke_app

      - run: flutter pub get
        working-directory: karaoke_app

      - run: flutter build windows --release
        working-directory: karaoke_app

      # Упаковываем готовую папку с .exe в один архив.
      - name: Упаковать результат
        run: Compress-Archive -Path karaoke_app/build/windows/x64/runner/Release/* -DestinationPath karaoke-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: karaoke-windows
          path: karaoke-windows.zip
